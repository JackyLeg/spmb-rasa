services:
  rasa:
    image: rasa/rasa:3.6.21-full
    ports:
      - "6005:5005" # Port 6005 di komputer Anda diteruskan ke 5005 di kontainer
    volumes:
      - ./:/app
    command:
      - run
      - --enable-api
      - --cors
      - "*"
      - -p
      - "5005" # Disamakan dengan port target di atas
    depends_on:
      - action_server

  action_server:
    image: rasa/rasa-sdk:3.6.2
    volumes:
      - ./actions:/app/actions
    command:
      - start
      - --actions
      - actions
      - -p
      - "5055"
    expose:
      - "5055"
