version: "3.1"

rules:

- rule: Greet user with greet_form
  steps:
  - intent: greet
  - action: greet_form
  - active_loop: greet_form

- rule: Submit greet_form
  condition:
  - active_loop: greet_form
  steps:
  - action: greet_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: utter_greet

- rule: Show menu
  steps:
  - intent: ask_menu
  - action: action_check_login_state
  - action: action_show_menu

- rule: Provide capabilities
  steps:
  - intent: ask_capabilities
  - action: utter_provide_info

- rule: Provide introduction
  steps:
  - intent: ask_introduction
  - action: utter_imabot

- rule: Say 'I am a bot' anytime the user challenges
  steps:
  - intent: bot_challenge
  - action: utter_imabot

