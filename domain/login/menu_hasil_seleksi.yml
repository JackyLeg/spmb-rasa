version: "3.1"

actions:
  - action_menu_hasil_seleksi

slots:
  menu_hasil_seleksi:
    type: categorical
    influence_conversation: true
    values:
      - Prosedur Hasil Seleksi
      - Persyaratan Hasil Seleksi
      - Hasil Hasil Seleksi
    mappings:
      - type: from_text
        conditions:
          - active_loop: menu_hasil_seleksi_form
            requested_slot: menu_hasil_seleksi

  menu_hasil_seleksi_confirmation:
    type: bool
    influence_conversation: true
    mappings:
      - type: from_intent
        intent: affirm
        value: true
        conditions:
          - active_loop: menu_hasil_seleksi_form
            requested_slot: menu_hasil_seleksi_confirmation
      - type: from_intent
        intent: deny
        value: false
        conditions:
          - active_loop: menu_hasil_seleksi_form
            requested_slot: menu_hasil_seleksi_confirmation

forms:
  menu_hasil_seleksi_form:
    required_slots:
      - menu_hasil_seleksi
      - menu_hasil_seleksi_confirmation

responses:
  utter_ask_menu_hasil_seleksi:
    - text: "Silakan pilih salah satu opsi hasil seleksi:"
      buttons:
        - title: "Prosedur Hasil Seleksi"
          payload: "Prosedur Hasil Seleksi"
        - title: "Persyaratan Hasil Seleksi"
          payload: "Persyaratan Hasil Seleksi"
        - title: "Hasil Hasil Seleksi"
          payload: "Hasil Hasil Seleksi"

  utter_ask_menu_hasil_seleksi_confirmation:
    - text: "Anda memilih opsi: {menu_hasil_seleksi}. Apakah ini benar?"
      buttons:
        - title: "Ya"
          payload: "Ya"
        - title: "Tidak"
          payload: "Tidak"

  utter_menu_hasil_seleksi_cancelled:
    - text: "Pilihan dibatalkan. Silakan pilih kembali opsi hasil seleksi."

  utter_menu_hasil_seleksi_ok:
    - text: "Anda telah memilih opsi hasil seleksi: {menu_hasil_seleksi}."

  utter_answer_prosedur_hasil_seleksi:
    - text: |
        PROSEDUR MELIHAT PENGUMUMAN HASIL SELEKSI
        1. Pengumuman hasil seleksi dipublikasikan sesuai jadwal gelombang yang diikuti.
        2. Login ke portal SPMB Trisakti pada hari pengumuman yang ditentukan.
        3. Lihat status kelulusan Anda pada menu dashboard masing-masing.

  utter_answer_persyaratan_hasil_seleksi:
    - text: |
        PERSYARATAN PENGUMUMAN HASIL SELEKSI
        1. Pengumuman hasil seleksi USM reguler Non-FK/FKG diumumkan pada hari Senin setelah pelaksanaan ujian (sesuai periode).
        2. Pengumuman hasil seleksi USM FK/FKG diumumkan pada hari Senin terjadwal (sekitar 8-9 hari setelah ujian).
        3. Hasil seleksi jalur Rapor/PSSB, Portofolio, dan UTBK Non-FK/FKG diumumkan secara berkala setiap hari Senin (atau Senin, Rabu, Jumat pada periode tertentu).
        4. Telah menyelesaikan seluruh rangkaian tes seleksi masuk atau verifikasi berkas prestasi.

  utter_answer_hasil_hasil_seleksi:
    - text: "Hasil seleksi pendaftaran Anda telah diterbitkan. Silakan cek status kelulusan di portal SPMB."

  utter_answer_error_hasil_seleksi:
    - text: "Maaf, terjadi kesalahan pada menu hasil seleksi. Silakan coba lagi."
