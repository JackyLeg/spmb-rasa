version: "3.1"

actions:
  - action_menu_penyetaraan

slots:
  menu_penyetaraan:
    type: categorical
    influence_conversation: true
    values:
      - Prosedur Penyetaraan
      - Persyaratan Penyetaraan
      - Hasil Penyetaraan
    mappings:
      - type: from_text
        conditions:
          - active_loop: menu_penyetaraan_form
            requested_slot: menu_penyetaraan

  menu_penyetaraan_confirmation:
    type: bool
    influence_conversation: true
    mappings:
      - type: from_intent
        intent: affirm
        value: true
        conditions:
          - active_loop: menu_penyetaraan_form
            requested_slot: menu_penyetaraan_confirmation
      - type: from_intent
        intent: deny
        value: false
        conditions:
          - active_loop: menu_penyetaraan_form
            requested_slot: menu_penyetaraan_confirmation

forms:
  menu_penyetaraan_form:
    required_slots:
      - menu_penyetaraan
      - menu_penyetaraan_confirmation

responses:
  utter_ask_menu_penyetaraan:
    - text: "Silakan pilih salah satu opsi penyetaraan:"
      buttons:
        - title: "Prosedur Penyetaraan"
          payload: "Prosedur Penyetaraan"
        - title: "Persyaratan Penyetaraan"
          payload: "Persyaratan Penyetaraan"
        - title: "Hasil Penyetaraan"
          payload: "Hasil Penyetaraan"

  utter_ask_menu_penyetaraan_confirmation:
    - text: "Anda memilih opsi: {menu_penyetaraan}. Apakah ini benar?"
      buttons:
        - title: "Ya"
          payload: "Ya"
        - title: "Tidak"
          payload: "Tidak"

  utter_menu_penyetaraan_cancelled:
    - text: "Pilihan dibatalkan. Silakan pilih kembali opsi penyetaraan."

  utter_menu_penyetaraan_ok:
    - text: "Anda telah memilih opsi penyetaraan: {menu_penyetaraan}."

  utter_answer_prosedur_penyetaraan:
    - text: |
        PROSEDUR PENYETARAAN MATA KULIAH / NILAI (BAGI PINDAHAN/LANJUT JENIS)
        1. Daftar online di https://spmb.trisakti.ac.id/ pada jalur Pindahan atau RPL Transfer Kredit (RPL-TK).
        2. Bayar biaya seleksi/penyetaraan sebesar Rp750.000 ke Virtual Account Bank BNI.
        3. Isi permohonan transfer mata kuliah, nilai, dan unggah dokumen persyaratan akademik/administrasi di portal.
        4. Tim Asesor RPL / Program Studi tujuan melakukan verifikasi dan penyetaraan konversi mata kuliah yang diakui.
        5. Hasil konversi diterbitkan dan sisa masa studi dihitung menggunakan rumus sisa studi resmi.

  utter_answer_persyaratan_penyetaraan:
    - text: |
        PERSYARATAN PENYETARAAN
        1. IPK minimal 2,75 dari program studi asal (untuk jalur RPL-TK alih jenjang) atau IPK minimal 2,50 (untuk jalur Pindahan).
        2. Berasal dari program studi yang terakreditasi minimal B/Baik Sekali dan terdaftar di PDDikti (dibuktikan dengan tangkapan layar/screenshot pencarian nama di https://pddikti.kemdiktisaintek.go.id).
        3. Jumlah SKS dari kampus asal paling sedikit adalah n x 12 SKS (di mana n adalah semester yang telah ditempuh) tanpa nilai D dan E.
        4. Batas maksimal SKS yang dapat diakui adalah 85% dari total SKS (maksimal 100 SKS) jika akreditasi prodi asal Sama atau Lebih Tinggi; atau maksimal 75% (maksimal 90 SKS) jika akreditasi prodi asal Lebih Rendah Satu Tingkat.
        5. Surat Keterangan Tidak Buta Warna (bagi prodi tertentu di lingkup FK, FKG, FSRD, FTKE, FALTL, FTSP, dan FTI [Teknik Mesin, Teknik Elektro, Teknik Industri]).

  utter_answer_hasil_penyetaraan:
    - text: "Hasil konversi penyetaraan nilai mata kuliah Anda telah selesai dinilai oleh program studi."

  utter_answer_error_penyetaraan:
    - text: "Maaf, terjadi kesalahan pada menu penyetaraan. Silakan coba lagi."
