version: "3.1"

actions:
  - action_menu_undur_diri

slots:
  menu_undur_diri:
    type: categorical
    influence_conversation: true
    values:
      - Prosedur Undur Diri
      - Persyaratan Undur Diri
      - Transaksi Undur Diri
      - Hasil Undur Diri
      - Prosedur Pembatalan Pendaftaran
      - Persyaratan Pembatalan Pendaftaran
      - Transaksi Pembatalan Pendaftaran
      - Hasil Pembatalan Pendaftaran
    mappings:
      - type: from_text
        conditions:
          - active_loop: menu_undur_diri_form
            requested_slot: menu_undur_diri

  menu_undur_diri_confirmation:
    type: bool
    influence_conversation: true
    mappings:
      - type: from_intent
        intent: affirm
        value: true
        conditions:
          - active_loop: menu_undur_diri_form
            requested_slot: menu_undur_diri_confirmation
      - type: from_intent
        intent: deny
        value: false
        conditions:
          - active_loop: menu_undur_diri_form
            requested_slot: menu_undur_diri_confirmation

forms:
  menu_undur_diri_form:
    required_slots:
      - menu_undur_diri
      - menu_undur_diri_confirmation

responses:
  utter_ask_menu_undur_diri:
    - text: "Silakan pilih salah satu opsi undur diri:"
      buttons:
        - title: "Prosedur Undur Diri"
          payload: "Prosedur Undur Diri"
        - title: "Persyaratan Undur Diri"
          payload: "Persyaratan Undur Diri"
        - title: "Transaksi Undur Diri"
          payload: "Transaksi Undur Diri"
        - title: "Hasil Undur Diri"
          payload: "Hasil Undur Diri"

  utter_ask_menu_undur_diri_confirmation:
    - text: "Anda memilih opsi: {menu_undur_diri}. Apakah ini benar?"
      buttons:
        - title: "Ya"
          payload: "Ya"
        - title: "Tidak"
          payload: "Tidak"

  utter_menu_undur_diri_cancelled:
    - text: "Pilihan dibatalkan. Silakan pilih kembali opsi undur diri."

  utter_menu_undur_diri_ok:
    - text: "Anda telah memilih opsi undur diri: {menu_undur_diri}."

  utter_answer_prosedur_undur_diri:
    - text: |
        PROSEDUR UNDUR DIRI CALON MAHASISWA BARU
        1. Login ke portal SPMB Trisakti.
        2. Masuk ke menu "Status Keuangan" dan tekan tab "Payment" untuk memeriksa jumlah pembayaran yang telah dilakukan.
        3. Pilih menu "Undur Diri".
        4. Pilih program studi yang akan diundurdirikan, lalu tekan tombol "Apply Quit".
        5. Isi data rekening pengembalian dana, lengkapi formulir aplikasi undur diri, dan unggah semua dokumen yang diminta.
        6. Setelah disetujui, calon mahasiswa dapat mengunduh "Bukti Pengajuan Undur Diri". Dana pengembalian ditransfer setelah diverifikasi oleh BAK.

  utter_answer_persyaratan_undur_diri:
    - text: |
        PERSYARATAN UNDUR DIRI
        1. Pengajuan undur diri dilakukan secara daring (online) oleh calon mahasiswa bersangkutan atau orang tua/wali paling lambat tanggal 11 Agustus 2026.
        2. Pengembalian biaya pendidikan dikenai potongan biaya administrasi sesuai jenjang program/fakultas:
            - Sarjana Kedokteran (FK): Rp50.000.000
            - Sarjana Kedokteran Gigi (FKG): Rp25.000.000
            - Program Magister & Doktor: Rp15.000.000
            - Program Sarjana lainnya (FH, FEB, FTSP, FTI, FTKE, FALTL, FSRD): Rp10.000.000
            - Program Diploma: Rp1.000.000
        3. Pengajuan di luar jadwal dan melebihi batas waktu (setelah 11 Agustus 2026) menyebabkan seluruh biaya pendidikan yang telah dibayarkan tidak dikembalikan dengan alasan apapun.

  utter_answer_transaksi_undur_diri:
    - text: "Silakan lengkapi berkas dan formulir pengajuan undur diri Anda untuk kami proses."

  utter_answer_hasil_undur_diri:
    - text: "Permohonan pengunduran diri Anda sedang diproses oleh admin akademik."

  utter_answer_error_undur_diri:
    - text: "Maaf, terjadi kesalahan pada menu undur diri. Silakan coba lagi."
