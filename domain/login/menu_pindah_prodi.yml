version: "3.1"

actions:
  - action_menu_pindah_prodi

slots:
  menu_pindah_prodi:
    type: categorical
    influence_conversation: true
    values:
      - Prosedur Pindah Prodi
      - Persyaratan Pindah Prodi
      - Transaksi Pindah Prodi
      - Hasil Pindah Prodi
    mappings:
      - type: from_text
        conditions:
          - active_loop: menu_pindah_prodi_form
            requested_slot: menu_pindah_prodi

  menu_pindah_prodi_confirmation:
    type: bool
    influence_conversation: true
    mappings:
      - type: from_intent
        intent: affirm
        value: true
        conditions:
          - active_loop: menu_pindah_prodi_form
            requested_slot: menu_pindah_prodi_confirmation
      - type: from_intent
        intent: deny
        value: false
        conditions:
          - active_loop: menu_pindah_prodi_form
            requested_slot: menu_pindah_prodi_confirmation

forms:
  menu_pindah_prodi_form:
    required_slots:
      - menu_pindah_prodi
      - menu_pindah_prodi_confirmation

responses:
  utter_ask_menu_pindah_prodi:
    - text: "Silakan pilih salah satu opsi pindah prodi:"
      buttons:
        - title: "Prosedur Pindah Prodi"
          payload: "Prosedur Pindah Prodi"
        - title: "Persyaratan Pindah Prodi"
          payload: "Persyaratan Pindah Prodi"
        - title: "Transaksi Pindah Prodi"
          payload: "Transaksi Pindah Prodi"
        - title: "Hasil Pindah Prodi"
          payload: "Hasil Pindah Prodi"

  utter_ask_menu_pindah_prodi_confirmation:
    - text: "Anda memilih opsi: {menu_pindah_prodi}. Apakah ini benar?"
      buttons:
        - title: "Ya"
          payload: "Ya"
        - title: "Tidak"
          payload: "Tidak"

  utter_menu_pindah_prodi_cancelled:
    - text: "Pilihan dibatalkan. Silakan pilih kembali opsi pindah prodi."

  utter_menu_pindah_prodi_ok:
    - text: "Anda telah memilih opsi pindah prodi: {menu_pindah_prodi}."

  utter_answer_prosedur_pindah_prodi:
    - text: |
        PROSEDUR PINDAH PROGRAM STUDI
        1. Mahasiswa mendaftar perpindahan lintas program studi dalam satu Fakultas atau antar Fakultas (jalur Pindahan Internal).
        2. Daftarkan permohonan melalui https://spmb.trisakti.ac.id/ dan bayar biaya seleksi/pindahan sebesar Rp750.000.
        3. Isi formulir permohonan transfer dan unggah berkas administrasi pendukung (transkrip nilai, akreditasi prodi asal, dan bukti aktif PDDikti).
        4. Perpindahan lintas prodi satu fakultas diproses sesuai ketentuan Fakultas. Perpindahan antar Fakultas disahkan Keputusan Rektor atas pertimbangan Dekan terkait.

  utter_answer_persyaratan_pindah_prodi:
    - text: |
        PERSYARATAN PINDAH PRODI
        1. Berstatus aktif dan terdaftar di PDDikti (https://pddikti.kemdiktisaintek.go.id).
        2. Kuliah di prodi asal tidak lebih dari 5 semester (khusus Fakultas Hukum tidak lebih dari 3 semester) dan tidak putus studi/drop out (DO).
        3. Menjalani kuliah minimal 2 semester dengan IPK minimal 2,50.
        4. Fakultas Kedokteran (FK) dan Fakultas Kedokteran Gigi (FKG) tidak menerima mahasiswa pindahan.

  utter_answer_transaksi_pindah_prodi:
    - text: "Silakan kirimkan formulir permohonan pindah program studi Anda untuk kami verifikasi."

  utter_answer_hasil_pindah_prodi:
    - text: "Permohonan perpindahan program studi Anda sedang diproses oleh tim panitia SPMB."

  utter_answer_error_pindah_prodi:
    - text: "Maaf, terjadi kesalahan pada menu pindah prodi. Silakan coba lagi."
